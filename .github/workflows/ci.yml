name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test calculator core math
        run: node --test tests/calculator-core.test.mjs
      - name: Test growth calculators
        run: node --test tests/growth-calculators.test.mjs
      - name: Test use-case calculators
        run: node --test tests/use-case-calculators.test.mjs
      - name: Test VAT promoted route
        run: node --test tests/vat-calculator.test.mjs
      - name: Test public navigation and search
        run: node --test tests/home-search.test.mjs tests/site-parity.test.mjs
      - name: Test localization runtime
        run: node --test tests/localization.test.mjs
      - name: Test public translation coverage
        run: node --test tests/public-i18n-coverage.test.mjs
      - name: Test Pro product flows
        run: node --test tests/pro-activation.test.mjs tests/pro-crm.test.mjs
      - name: Audit public static site
        run: node scripts/site-audit.mjs
      - name: Audit accessibility
        run: node scripts/accessibility-audit.mjs
      - name: Audit Pro localization
        run: node scripts/pro-i18n-audit.mjs
      - name: Audit Pro spreadsheet transfer
        run: node scripts/pro-spreadsheet-audit.mjs
      - name: Audit Pro team and workspace rules
        run: node scripts/pro-team-audit.mjs
