name: Normalize public pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize metadata, shared navigation and sitemap
        run: |
          node scripts/normalize-heads.mjs
          node scripts/generate-sitemap.mjs
      - name: Commit normalized public files
        run: |
          if git diff --quiet; then
            echo "No normalization changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize public metadata and sitemap"
          git push
