name: Search Console opportunities
on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/gsc-export.mjs
        env:
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      - run: node scripts/gsc-opportunities.mjs reports/gsc-queries.csv
      - uses: actions/upload-artifact@v4
        with:
          name: gsc-opportunities
          path: reports/gsc-opportunities.md
