<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>SoloBizKit Pro</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/pro/pro.css" />
  <link rel="stylesheet" href="/pro/pro-auth.css" />
</head>
<body>
  <div class="app-shell signed-out">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="SoloBizKit home">
        <span class="brand-mark">SB</span>
        <span><strong>SoloBizKit</strong><small>PRO</small></span>
      </a>
      <nav class="nav" aria-label="Pro navigation">
        <button class="nav-item active" data-view="dashboard">Dashboard</button>
        <button class="nav-item" data-view="customers">Customers</button>
        <button class="nav-item" data-view="invoices">Invoices</button>
        <a class="nav-item" href="/pro/estimates/">Estimates</a>
        <a class="nav-item" href="/pro/recurring/">Recurring</a>
        <a class="nav-item" href="/pro/settings/">Settings</a>
      </nav>
      <div class="sidebar-footer">
        <span class="pro-pill">Pro workspace</span>
        <p>CRM, estimates and invoicing for solo businesses.</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">SOLOBIZKIT PRO</p>
          <h1 id="pageTitle">Pro workspace</h1>
        </div>
        <div class="top-actions">
          <div id="authActions"></div>
          <button class="btn secondary" id="newCustomerTop">+ Customer</button>
          <button class="btn primary" id="newInvoiceTop">+ Invoice</button>
        </div>
      </header>
      <section id="app" class="content" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-card" id="modalForm">
      <div class="modal-head">
        <div><p class="eyebrow">SOLOBIZKIT PRO</p><h2 id="modalTitle">New item</h2></div>
        <button class="icon-btn" value="cancel" aria-label="Close">×</button>
      </div>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button class="btn secondary" value="cancel">Cancel</button>
        <button class="btn primary" value="default">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/pro/pro-app.js"></script>
  <script type="module" src="/pro/deep-links.js"></script>
  <script type="module" src="/pro/document-defaults.js"></script>
  <script type="module" src="/pro/reminder-actions.js"></script>
  <script type="module" src="/pro/payment-actions.js"></script>
  <script type="module" src="/pro/email-actions-v2.js"></script>
  <script type="module" src="/pro/customer-history.js"></script>
  <script type="module" src="/pro/customer-portal-actions.js"></script>
</body>
</html>
