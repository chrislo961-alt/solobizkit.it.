<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Estimates · SoloBizKit Pro</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/pro/pro.css" />
  <link rel="stylesheet" href="/pro/pro-auth.css" />
  <link rel="stylesheet" href="/pro/estimates/estimates.css" />
</head>
<body>
  <div class="app-shell signed-out" id="shell">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="SoloBizKit home"><span class="brand-mark">SB</span><span><strong>SoloBizKit</strong><small>PRO</small></span></a>
      <nav class="nav" aria-label="Pro navigation">
        <a class="nav-item" href="/pro/">Dashboard</a>
        <a class="nav-item" href="/pro/">Customers</a>
        <a class="nav-item" href="/pro/">Invoices</a>
        <a class="nav-item active" href="/pro/estimates/">Estimates</a>
        <a class="nav-item" href="/pro/settings/">Settings</a>
      </nav>
      <div class="sidebar-footer"><span class="pro-pill">Pro workspace</span><p>CRM, estimates and invoicing for solo businesses.</p></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><p class="eyebrow">SOLOBIZKIT PRO</p><h1 id="pageTitle">Estimates</h1></div>
        <div class="top-actions"><div id="authActions"></div><button class="btn primary" id="newEstimate">+ Estimate</button></div>
      </header>
      <section id="app" class="content" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-card" id="modalForm">
      <div class="modal-head"><div><p class="eyebrow">SOLOBIZKIT PRO</p><h2 id="modalTitle">New estimate</h2></div><button class="icon-btn" value="cancel" aria-label="Close">×</button></div>
      <div id="modalBody"></div>
      <div class="modal-actions"><button class="btn secondary" value="cancel">Cancel</button><button class="btn primary" value="default">Save</button></div>
    </form>
  </dialog>
  <script type="module" src="/pro/estimates/estimates.js"></script>
  <script type="module" src="/pro/document-defaults.js"></script>
  <script type="module" src="/pro/email-actions.js"></script>
</body>
</html>
