<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Customer portal · SoloBizKit</title>
  <link rel="icon" href="/favicon.svg" />
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#15171a;background:#f4f6f5}*{box-sizing:border-box}body{margin:0}.wrap{width:min(980px,calc(100% - 28px));margin:30px auto 60px}.shell{background:#fff;border:1px solid #e2e7e4;border-radius:22px;overflow:hidden;box-shadow:0 18px 50px rgba(17,29,22,.08)}header{padding:26px 30px;border-bottom:1px solid #e9ecea;display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{display:flex;gap:14px;align-items:center}.logo{width:50px;height:50px;border-radius:14px;object-fit:contain;background:#f7f8f7;border:1px solid #e4e7e5}.mark{width:46px;height:46px;border-radius:13px;background:#183c2b;color:#fff;display:grid;place-items:center;font-weight:800}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:#77817a;margin:0 0 5px}.brand h1{font-size:22px;margin:0}.content{padding:30px}.welcome{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}.welcome h2{font-size:34px;margin:4px 0 8px}.muted{color:#69736c}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.chip{padding:8px 10px;border-radius:999px;background:#f4f7f5;font-size:12px;font-weight:700}.section{margin-top:32px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:12px}.section-head h3{font-size:20px;margin:0}.list{display:grid;gap:10px}.doc-card{border:1px solid #e5e8e6;border-radius:14px;overflow:hidden}.row{display:grid;grid-template-columns:minmax(180px,1.3fr) 140px 120px 130px auto;gap:14px;align-items:center;padding:14px}.row strong{display:block}.label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#7b857e}.status{display:inline-flex;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800;text-transform:capitalize;width:max-content}.status.paid,.status.accepted{background:#ecfdf3;color:#027a48}.status.sent{background:#eef4ff;color:#3448a3}.status.overdue,.status.declined{background:#fff1f0;color:#b42318}.status.converted{background:#f4f3ff;color:#5925dc}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.btn{border:1px solid #dce2de;border-radius:10px;padding:9px 12px;font-weight:800;text-decoration:none;color:#15171a;background:#fff;cursor:pointer}.btn.primary{background:#183c2b;color:#fff;border-color:#183c2b}.btn.danger{color:#b42318}.empty{padding:22px;border:1px dashed #dfe5e1;border-radius:14px;color:#69736c}.empty.compact{padding:12px}.doc-details{border-top:1px solid #edf0ee;background:#fbfcfb}.doc-details summary{cursor:pointer;padding:12px 14px;font-size:12px;font-weight:800;color:#405148;list-style:none}.doc-details summary::-webkit-details-marker{display:none}.doc-details summary::after{content:'+';float:right}.doc-details[open] summary::after{content:'−'}.doc-body{padding:0 14px 16px}.doc-meta{display:flex;gap:22px;flex-wrap:wrap;padding:10px 0 14px}.doc-meta span{font-size:12px;color:#69736c}.doc-meta b{display:block;color:#15171a;margin-bottom:2px}.items{border:1px solid #e8ece9;border-radius:12px;overflow:hidden}.item{display:flex;justify-content:space-between;gap:18px;padding:11px 12px;border-bottom:1px solid #edf0ee}.item:last-child{border-bottom:0}.item small{display:block;color:#78827b;margin-top:3px}.totals{margin:14px 0 0 auto;width:min(320px,100%)}.totals div{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}.totals .grand{border-top:1px solid #dde4df;margin-top:5px;padding-top:10px;font-size:16px}.notes{margin-top:14px;padding:12px;background:#f4f7f5;border-radius:10px;font-size:13px}.notes p{white-space:pre-wrap;margin:6px 0 0}.contact{margin-top:30px;padding-top:20px;border-top:1px solid #ecefed;font-size:13px}.error{padding:50px 30px;text-align:center}.foot{text-align:center;color:#8a948d;font-size:11px;margin:14px 0 0}@media(max-width:760px){.wrap{margin:14px auto}.shell{border-radius:16px}header,.content{padding:20px}.welcome{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.row .main{grid-column:1/-1}.actions{grid-column:1/-1;justify-content:stretch}.actions .btn{flex:1}.welcome h2{font-size:28px}}@media(max-width:520px){header{align-items:flex-start}.row{grid-template-columns:1fr}.row .main,.actions{grid-column:auto}.actions{display:grid;grid-template-columns:1fr 1fr}.item{align-items:flex-start}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="shell" id="portal"><div class="error"><h1>Opening customer portal…</h1><p class="muted">Please wait a moment.</p></div></section>
    <p class="foot">Secure customer portal powered by SoloBizKit.</p>
  </main>
  <script type="module" src="/portal/portal.js"></script>
</body>
</html>
