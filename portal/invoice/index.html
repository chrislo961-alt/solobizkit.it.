<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Invoice portal · SoloBizKit</title>
  <link rel="icon" href="/favicon.svg" />
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#15171a;background:#f4f6f5}*{box-sizing:border-box}body{margin:0}.wrap{width:min(920px,calc(100% - 28px));margin:34px auto}.shell{background:#fff;border:1px solid #e2e7e4;border-radius:22px;overflow:hidden;box-shadow:0 18px 50px rgba(17,29,22,.08)}header{padding:28px 30px;border-bottom:1px solid #e9ecea;display:flex;justify-content:space-between;gap:24px;align-items:flex-start}.brand{display:flex;gap:14px;align-items:center}.logo{width:52px;height:52px;border-radius:14px;object-fit:contain;background:#f7f8f7;border:1px solid #e4e7e5}.mark{width:46px;height:46px;border-radius:13px;background:#183c2b;color:#fff;display:grid;place-items:center;font-weight:800}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:#77817a;margin:0 0 5px}.brand h1{font-size:22px;margin:0}.meta{text-align:right}.meta strong{font-size:24px;display:block}.status{display:inline-flex;margin-top:8px;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:800;text-transform:capitalize}.status.paid{background:#ecfdf3;color:#027a48}.status.sent{background:#eef4ff;color:#3448a3}.status.overdue{background:#fff1f0;color:#b42318}.status.draft{background:#f2f4f7;color:#475467}.content{padding:30px}.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;margin-bottom:28px}.hero h2{font-size:34px;margin:4px 0 8px}.muted{color:#69736c}.amount{text-align:right}.amount small{display:block;color:#69736c}.amount strong{font-size:34px}.dates{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:13px}.dates span{padding:8px 10px;background:#f7f8f7;border-radius:9px}.table-wrap{overflow:auto;border:1px solid #e5e8e6;border-radius:14px}table{width:100%;border-collapse:collapse;min-width:640px}th,td{padding:13px 14px;border-bottom:1px solid #ecefed;text-align:left;font-size:13px}th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#7b857e;background:#fafbfa}tr:last-child td{border-bottom:0}.right{text-align:right}.totals{width:min(360px,100%);margin:22px 0 0 auto}.totals div{display:flex;justify-content:space-between;padding:7px 0}.totals .grand{font-size:20px;border-top:2px solid #1b211d;margin-top:7px;padding-top:12px}.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:28px}.btn{border:1px solid #dce2de;border-radius:10px;padding:11px 16px;font-weight:800;text-decoration:none;color:#15171a;background:#fff}.btn.primary{background:#183c2b;color:#fff;border-color:#183c2b}.notes{margin-top:26px;padding:16px;border-radius:12px;background:#f7f8f7;line-height:1.55}.contact{margin-top:28px;padding-top:20px;border-top:1px solid #ecefed;font-size:13px}.error{padding:50px 30px;text-align:center}.error h1{font-size:26px}.foot{text-align:center;color:#8a948d;font-size:11px;margin:14px 0 0}@media(max-width:680px){.wrap{margin:14px auto}.shell{border-radius:16px}header,.content{padding:20px}.hero{grid-template-columns:1fr}.amount{text-align:left}.meta{text-align:left}.brand{align-items:flex-start}header{display:grid}.actions{justify-content:stretch}.actions .btn{flex:1;text-align:center}.hero h2,.amount strong{font-size:28px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="shell" id="portal"><div class="error"><h1>Opening invoice…</h1><p class="muted">Please wait a moment.</p></div></section>
    <p class="foot">Secure customer portal powered by SoloBizKit.</p>
  </main>
  <script type="module" src="/portal/invoice/portal.js"></script>
</body>
</html>
