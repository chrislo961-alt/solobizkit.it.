<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Review estimate · SoloBizKit</title>
  <link rel="icon" href="/favicon.svg" />
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#15171a;font-family:Inter,Arial,sans-serif;line-height:1.5}.wrap{max-width:860px;margin:0 auto;padding:32px 18px 64px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;margin-bottom:28px}.mark{width:38px;height:38px;border-radius:10px;background:#111;color:#fff;display:grid;place-items:center;font-weight:800}.card{background:#fff;border:1px solid #e4e6ea;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.05);padding:28px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;color:#6b7280;margin:0 0 6px}h1{font-size:32px;margin:0}.muted{color:#6b7280}.meta{display:flex;flex-wrap:wrap;gap:12px 24px;margin:18px 0 26px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:12px 10px;border-bottom:1px solid #eceef1;text-align:left}th{font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}.right{text-align:right}.totals{margin:24px 0 0 auto;max-width:330px}.totals div{display:flex;justify-content:space-between;padding:6px 0}.grand{font-size:19px;font-weight:800;border-top:2px solid #111;margin-top:6px;padding-top:10px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}.accept{background:#111;color:#fff}.decline{background:#eceef1;color:#111}.status{margin-top:18px;padding:12px 14px;border-radius:10px;background:#f0f2f4}.status.good{background:#eaf8ef;color:#146b35}.status.bad{background:#fff0f2;color:#9f1239}.notes{margin-top:24px;padding:16px;background:#f7f7f8;border-radius:10px}@media(max-width:600px){h1{font-size:26px}.card{padding:20px}.actions .btn{flex:1}}
  </style>
</head>
<body>
  <div class="wrap">
    <a class="brand" href="/"><span class="mark">SB</span><strong>SoloBizKit</strong></a>
    <main id="app" class="card"><p class="eyebrow">ESTIMATE</p><h1>Review estimate</h1><p class="muted">Loading estimate…</p></main>
  </div>
  <script>
    const SUPABASE_URL='https://eaqddwqprhofpizbpziq.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY='sb_publishable_9PpiWr0duM-ve-mcqkCysg_BpX58a9O';
    const app=document.querySelector('#app');
    const params=new URLSearchParams(location.search);
    const token=params.get('token')||'';
    const product=params.get('product')==='solobizkit'?'solobizkit':'';
    const esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
    const money=(v,c='USD')=>{try{return new Intl.NumberFormat(undefined,{style:'currency',currency:c}).format(Number(v)||0)}catch{return `${Number(v||0).toFixed(2)} ${c}`}};
    async function request(method,body){const suffix=method==='GET'?`?token=${encodeURIComponent(token)}${product?'&product=solobizkit':''}`:'';const url=`${SUPABASE_URL}/functions/v1/estimate-response${suffix}`;const res=await fetch(url,{method,headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:`Bearer ${SUPABASE_PUBLISHABLE_KEY}`,'Content-Type':'application/json'},...(method==='POST'?{body:JSON.stringify({...body,product})}:{})});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'Could not load estimate.');return data}
    function renderEstimate(e){const locked=['accepted','declined','converted'].includes(e.status)||e.expired;app.innerHTML=`<p class="eyebrow">ESTIMATE · ${esc(e.brand||'SoloBizKit')}</p><h1>${esc(e.number)}</h1><div class="meta"><span><strong>${esc(e.companyName)}</strong></span><span>${esc(e.customerName)}</span><span>Issued ${esc(e.issueDate||'—')}</span><span>Valid until ${esc(e.validUntil||'—')}</span></div><div class="table-wrap"><table><thead><tr><th>Description</th><th class="right">Qty</th><th class="right">Price</th><th class="right">Tax</th><th class="right">Amount</th></tr></thead><tbody>${(e.items||[]).map(i=>{const qty=Number(i.quantity||0),price=Number(i.unit_price||0),tax=Number(i.tax_rate||0);return `<tr><td>${esc(i.description)}</td><td class="right">${qty}</td><td class="right">${money(price,e.currency)}</td><td class="right">${tax}%</td><td class="right">${money(qty*price*(1+tax/100),e.currency)}</td></tr>`}).join('')}</tbody></table></div><div class="totals"><div><span>Subtotal</span><strong>${money(e.subtotal,e.currency)}</strong></div><div><span>Tax</span><strong>${money(e.taxTotal,e.currency)}</strong></div><div class="grand"><span>Total</span><strong>${money(e.total,e.currency)}</strong></div></div>${e.notes?`<div class="notes"><strong>Notes</strong><div>${esc(e.notes).replace(/\n/g,'<br>')}</div></div>`:''}<div id="responseStatus" class="status ${e.status==='accepted'?'good':e.status==='declined'?'bad':''}">${e.expired?'This estimate has expired.':e.status==='accepted'?'This estimate has been accepted.':e.status==='declined'?'This estimate has been declined.':e.status==='converted'?'This estimate has already been converted to an invoice.':'Review the estimate and choose an option below.'}</div>${locked?'':`<div class="actions"><button class="btn accept" data-decision="accepted">Accept estimate</button><button class="btn decline" data-decision="declined">Decline</button></div>`}${e.companyEmail||e.companyPhone?`<p class="muted" style="margin-top:24px">Questions? ${e.companyEmail?`Email ${esc(e.companyEmail)}`:''}${e.companyEmail&&e.companyPhone?' · ':''}${e.companyPhone?esc(e.companyPhone):''}</p>`:''}`;app.querySelectorAll('[data-decision]').forEach(btn=>btn.onclick=()=>respond(btn.dataset.decision));}
    async function respond(decision){const buttons=[...app.querySelectorAll('[data-decision]')];buttons.forEach(b=>b.disabled=true);const status=app.querySelector('#responseStatus');status.textContent='Saving your response…';try{await request('POST',{token,decision});status.className=`status ${decision==='accepted'?'good':'bad'}`;status.textContent=decision==='accepted'?'Thank you. The estimate has been accepted.':'Your decline has been saved.';buttons.forEach(b=>b.remove())}catch(err){status.className='status bad';status.textContent=err.message;buttons.forEach(b=>b.disabled=false)}}
    (async()=>{if(!token){app.innerHTML='<h1>Invalid link</h1><p class="muted">This estimate link is missing or invalid.</p>';return}try{const data=await request('GET');renderEstimate(data.estimate)}catch(err){app.innerHTML=`<h1>Estimate unavailable</h1><p class="muted">${esc(err.message)}</p>`}})();
  </script>
</body>
</html>
